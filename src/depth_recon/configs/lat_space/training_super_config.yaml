# Mask-aware AE data preset and latent diffusion training/inference preset.
# Supply model.latent.ae_checkpoint using --set after AE training.
scenario: temperature
data:
  dataset:
    core:
      dataset_variant: argo_geotiff_gridded
      dataloader_type: light
      geotiff_root_dir: /work/data/OceanVariableReconstruction
      metadata_cache_dir: /work/data/OceanVariableReconstruction/depthdif_cache
    grid:
      tile_size: 128
      resolution_deg: 0.1
      patch_grid_source: land_mask
      land_mask_path: masks/world_land_mask_glorys_0p1.tif
      patch_stride: 32
      max_land_fraction: 0.3
    sampling:
      temporal_window_days: 7
      glorys_var_name: thetao
      ostia_var_name: analysed_sst
      eo_source: ostia
      eo_var_name: analysed_sst
    selection:
      require_argo_for_train: true
      require_argo_for_val: true
      require_argo_for_all: false
      filter_bad_argo_quality: true
      accepted_argo_qc_flags:
      - 1
      - 2
    surface_conditioning:
      sources:
      - sst
      - sss
      - adt
    output:
      return_info: false
      return_coords: true
    wet_domain:
      enabled: true
    runtime:
      random_seed: 7
      cache_size: 8
  split:
    val_year: 2016
    val_fraction: 0.2
  dataloader:
    num_workers: 2
    prefetch_factor: 2
    val_shuffle: true
model:
  model_type: latent_cond_dif
  resume_checkpoint: false
  load_checkpoint_only: false
  depth_channels: 50
  output_fields:
  - temperature
  condition_eo_channels: 3
  condition_per_depth_valid_mask: true
  condition_use_wet_mask: true
  mask_diffusion_with_wet_mask: true
  climatology_residual: false
  generated_channels: 12
  condition_channels: 116
  condition_mask_channels: 50
  condition_include_eo: true
  condition_use_valid_mask: true
  condition_use_land_mask: true
  clamp_known_pixels: false
  mask_loss_with_valid_pixels: true
  parameterization: x0
  log_intermediates: true
  ema:
    enabled: false
    decay: 0.9999
    apply_every_n_steps: 1
    start_step: 0
    save_ema_weights_in_callback_state: true
    evaluate_ema_weights_instead: true
  latent:
    ae_config_path: src/depth_recon/configs/lat_space/ae_config.yaml
    ae_checkpoint: null
    decoded_observation_weight: 0.0
    freeze_autoencoder: true
    latent_channels: 12
    spatial_downsample: 1
    eo_in_pixel_space: true
  ambient_occlusion:
    enabled: false
    further_drop_prob: 0.1
    apply_to_noisy_branch: true
    shared_spatial_mask: true
    min_kept_observed_pixels: 1
    require_x0_parameterization: true
  post_process:
    gaussian_blur:
      enabled: false
      sigma: 0.5
      kernel_size: 3
  coord_conditioning:
    enabled: true
    encoding: unit_sphere
    include_date: true
    date_encoding: day_of_year_sincos
    embed_dim: null
  unet:
    dim: 64
    dim_mults:
    - 1
    - 2
    - 4
    - 8
    with_time_emb: true
    output_mean_scale: false
    residual: false
training:
  training:
    lr: 5.0e-05
    batch_size: 24
    noise:
      num_timesteps: 1000
      schedule: cosine
      beta_start: 0.0001
      beta_end: 0.02
    reconstruction_eval:
      sample_count: 128
      batch_size: 4
      seed: 7
    validation_sampling:
      sampler: ddim
      ddim_num_timesteps: 200
      ddim_eta: 0.0
      log_intermediates: true
      skip_full_reconstruction_in_sanity_check: false
      max_full_reconstruction_samples: 5
  trainer:
    max_epochs: 100
    accelerator: auto
    devices: auto
    num_gpus: 1
    strategy: auto
    precision: 16-mixed
    matmul_precision: high
    suppress_accumulate_grad_stream_mismatch_warning: true
    suppress_lightning_pytree_warning: true
    ckpt_monitor: val/full_reconstruction_score
    lr_logging_interval: step
    log_every_n_steps: 50
    num_sanity_val_steps: 2
    val_batches_per_epoch: 200
    limit_val_batches: 4
    enable_model_summary: true
    gradient_clip_val: 1.0
    rebuild_index: false
  wandb:
    offline: true
    project: DepthDif_Simon
    entity: esa-phi-lab
    run_name: latent_cond_eo
    log_model: 'false'
    verbose: true
    watch_gradients: false
    watch_parameters: false
    watch_log_freq: 100
    watch_log_graph: false
    log_stats_every_n_steps: 500
    log_images_every_n_steps: 10
  dataloader:
    batch_size: 32
    val_batch_size: 5
    num_workers: 6
    val_num_workers: 0
    persistent_workers: true
    val_persistent_workers: false
    prefetch_factor: 8
    shuffle: true
    val_shuffle: true
    pin_memory: true
  scheduler:
    warmup:
      enabled: false
      steps: 15000
      start_ratio: 0.2
    reduce_on_plateau:
      enabled: true
      monitor: val/full_reconstruction_score
      interval: epoch
      mode: min
      factor: 0.5
      patience: 10
      threshold: 0.0001
      threshold_mode: rel
      cooldown: 0
      min_lr: 0.0
      eps: 1.0e-08
inference:
  sampling:
    sampler: ddim
    ddim_num_timesteps: 200
  dataloader:
    batch_size: 2
    num_workers: 0
