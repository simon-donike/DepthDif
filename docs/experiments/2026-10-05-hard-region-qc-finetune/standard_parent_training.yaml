training:
  lr: 0.0001
  noise:
    num_timesteps: 1000
    schedule: cosine
    beta_start: 0.0001
    beta_end: 0.02
  validation_sampling:
    sampler: ddpm
    ddim_num_timesteps: 100
    ddim_eta: 0.0
    ddim_temperature: 1.0
    log_intermediates: false
    skip_full_reconstruction_in_sanity_check: true
    full_reconstruction_logging_enabled: true
    max_full_reconstruction_samples: 1
  en4_candidate_eval:
    enabled: false
    candidate_profiles_path: instructions/en4_no_spatiotemporal_candidate_profiles.parquet
    iso_week: 25
    holdout_fraction: 0.2
    seed: 7
    min_input_profiles: 8
    max_patches: 1
    max_profiles_to_plot: 6
    image_depths_m:
    - 0.0
    - 100.0
    - 500.0
  hard_region_eval:
    enabled: false
    regions_path: src/depth_recon/configs/evaluation/hard_regions_2016.yaml
    evaluation_year: 2016
    max_patches_per_region: 1
    seed: 7
    image_depths_m:
    - 0.0
    - 100.0
    - 500.0
trainer:
  seed: 7
  max_epochs: 100
  accelerator: auto
  devices: 2
  num_gpus: null
  strategy: ddp
  precision: 16-mixed
  matmul_precision: high
  suppress_accumulate_grad_stream_mismatch_warning: true
  suppress_lightning_pytree_warning: true
  ckpt_monitor: val/loss_ckpt
  lr_logging_interval: step
  log_every_n_steps: 25
  num_sanity_val_steps: 1
  val_check_interval: 0.25
  limit_train_batches: 1.0
  limit_val_batches: 64
  checkpoint_every_n_train_steps: null
  max_time: null
  enable_model_summary: true
  gradient_clip_val: 1.0
  early_stopping:
    enabled: false
    monitor: val/loss_ckpt
    mode: min
    patience: 5
    min_delta: 0.0
    check_finite: true
    verbose: true
wandb:
  offline: false
  project: DepthDif_Simon
  entity: esa-phi-lab
  run_name: glorys_dense_reproduction_2016_2x3090_slow_lr
  run_id: null
  resume: null
  group: null
  job_type: null
  tags: null
  log_model: 'false'
  verbose: true
  watch_gradients: false
  watch_parameters: false
  watch_log_freq: 100
  watch_log_graph: false
  log_stats_every_n_steps: 200
  log_images_every_n_steps: 200
dataloader:
  batch_size: 48
  val_batch_size: 6
  num_workers: 2
  val_num_workers: 0
  persistent_workers: false
  val_persistent_workers: false
  prefetch_factor: 2
  multiprocessing_context: spawn
  shuffle: true
  val_shuffle: true
  pin_memory: true
scheduler:
  warmup:
    enabled: false
    steps: 2000
    start_ratio: 0.2
  reduce_on_plateau:
    enabled: true
    monitor: val/loss_ckpt
    interval: epoch
    mode: min
    factor: 0.5
    patience: 5
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 1.0e-06
    eps: 1.0e-08
