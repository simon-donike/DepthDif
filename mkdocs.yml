site_name: DepthDif
site_description: Densifying sparse ocean depth observations with conditional diffusion.
repo_name: DepthDif
repo_url: https://github.com/simon-donike/DepthDif
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/branding/website_icon.webp
  favicon: assets/branding/website_icon.webp
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.action.edit
    - content.action.view
  palette:
    scheme: slate
    primary: blue
    accent: light blue

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/simon-donike/DepthDif

extra_css:
  - stylesheets/extra.css
  - stylesheets/globe.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/remove-tab-tooltips.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/load-cesium-globe.js

plugins:
  - search
  - mkdocstrings:
      # Allow local builds to run even when mkdocstrings handler deps are unavailable.
      enabled: !ENV [ENABLE_MKDOCSTRINGS, false]
      handlers:
        python:
          paths:
            - src
          options:
            show_source: false
            show_root_heading: true

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list
  - pymdownx.arithmatex:
      generic: true

nav:
  - Overview:
      - Overview: index.md
      - Quick Start: quickstart.md
      - Development: development.md
      - Tests: tests.md
  - Model and Training:
      - Model: model.md
      - Training: training.md
      - Ambient Occlusion Objective: ambient-occlusion-objective.md
      - Auxiliary Losses: losses.md
      - EMA Weights: ema.md
      - Coordinate and Date Conditioning: data-coordinate-injection.md
      - Baselines: baselines.md
      - Autoencoder and Latent Components: autoencoder.md
      - Synthetic Vertical-Offset Prior: vertical-offset-pretraining.md
  - Data:
      - Overview: data.md
      - Data Sources: data-source.md
      - Dataset Downloads: data-download.md
      - Depth Alignment: depth-alignment.md
      - Data Export: data-export.md
      - Data Contract: data-contract.md
      - Production Dataset: production-datasets.md
  - Evaluation and Inference:
      - Workflows: inference.md
      - Public Inference Package: public-inference-package.md
      - Uncertainty: uncertainty.md
      - GLORYS-comparative Evaluation: glorys-comparative-evaluation.md
      - Spectral Wavenumber Validation: spectral-wavenumber-validation.md
  - Analysis: analysis/index.html
  - Reference:
      - Configuration Settings: settings.md
      - CLI Reference: cli.md
      - Python API: api.md
